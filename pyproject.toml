[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "open-wam"
version = "0.1.0"
description = "Unified WAM research framework with a fixed LingBot-compatible video backbone."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.1.0",
    "diffusers>=0.35.0",
    "einops>=0.8.0",
    "imageio>=2.36.0",
    "imageio-ffmpeg>=0.6.0",
    "huggingface_hub>=0.30",
    "torch>=2.4",
    "lightning>=2.4",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyarrow>=18.0",
    "pyyaml>=6.0",
    "robosuite==1.4.0",
    "bddl==1.0.1",
    "termcolor>=3.3.0",
    "future>=1.0.0",
    "easydict>=1.13",
    "hydra-core>=1.3.2",
    "gym==0.25.2",
    "h5py>=3.11.0",
    "matplotlib>=3.10.8",
    "msgpack>=1.1.2",
    "cloudpickle>=3.1.2",
    "sentencepiece>=0.2.0",
    "transformers>=4.52.0",
    "websockets>=15.0",
    "wandb>=0.25.1",
]

[project.optional-dependencies]
viz = [
    "mujoco>=3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/open_wam"]

[tool.uv]
package = true
