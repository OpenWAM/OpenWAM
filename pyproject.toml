[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "open-wam"
version = "0.1.0"
description = "Unified WAM research framework with a fixed LingBot-compatible video backbone."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
open-wam-train = "open_wam.cli.train:main"
open-wam-eval = "open_wam.cli.eval:main"
open-wam-inspect-config = "open_wam.cli.inspect_config:main"
open-wam-validate-config = "open_wam.cli.validate_config:main"
open-wam-sanity = "open_wam.cli.sanity:main"
open-wam-sim-rollout = "open_wam.cli.sim_rollout:main"

[project.optional-dependencies]
core = []
torch = [
    "diffusers>=0.35.0",
    "einops>=0.8.0",
    "huggingface_hub>=0.30",
    "msgpack>=1.1.2",
    "numpy>=1.26",
    "pillow>=10.0",
    "sentencepiece>=0.2.0",
    "torch>=2.4",
    "transformers>=4.52.0",
]
train = [
    "accelerate>=1.1.0",
    "diffusers>=0.35.0",
    "einops>=0.8.0",
    "h5py>=3.11.0",
    "huggingface_hub>=0.30",
    "imageio>=2.36.0",
    "imageio-ffmpeg>=0.6.0",
    "msgpack>=1.1.2",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyarrow>=18.0",
    "sentencepiece>=0.2.0",
    "torch>=2.4",
    "transformers>=4.52.0",
]
eval = [
    "diffusers>=0.35.0",
    "einops>=0.8.0",
    "h5py>=3.11.0",
    "huggingface_hub>=0.30",
    "imageio>=2.36.0",
    "imageio-ffmpeg>=0.6.0",
    "matplotlib>=3.10.8",
    "msgpack>=1.1.2",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyarrow>=18.0",
    "sentencepiece>=0.2.0",
    "torch>=2.4",
    "transformers>=4.52.0",
]
