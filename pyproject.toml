[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "open-wam"
version = "0.1.0"
description = "Unified WAM research framework with a fixed LingBot-compatible video backbone."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub>=0.30",
    "torch>=2.4",
    "lightning>=2.4",
    "pillow>=10.0",
    "pyarrow>=18.0",
    "pyyaml>=6.0",
    "robosuite==1.4.0",
    "bddl==1.0.1",
    "termcolor>=3.3.0",
    "future>=1.0.0",
    "easydict>=1.13",
    "hydra-core>=1.3.2",
    "gym==0.25.2",
    "matplotlib>=3.10.8",
    "cloudpickle>=3.1.2",
]

[project.optional-dependencies]
viz = [
    "mujoco>=3.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/open_wam"]

[tool.uv]
package = true
