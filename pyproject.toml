[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "open-wam"
version = "0.1.0"
description = "Extensible world-action-model training and evaluation with a LingBot-compatible visual core."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Open-WAM contributors" },
]
keywords = ["robotics", "world action models", "world models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Documentation = "https://daivdyuan.github.io/Open-WAM/"
Issues = "https://github.com/DaivdYuan/Open-WAM/issues"
Repository = "https://github.com/DaivdYuan/Open-WAM"

[project.scripts]
open-wam-train = "open_wam.cli.train:main"
open-wam-eval = "open_wam.cli.eval:main"
open-wam-inspect-config = "open_wam.cli.inspect_config:main"
open-wam-validate-config = "open_wam.cli.validate_config:main"
open-wam-sanity = "open_wam.cli.sanity:main"
open-wam-sim-rollout = "open_wam.cli.sim_rollout:main"

[project.optional-dependencies]
core = []
torch = [
    "diffusers>=0.35.0",
    "einops>=0.8.0",
    "huggingface_hub>=0.30",
    "msgpack>=1.1.2",
    "numpy>=1.26",
    "pillow>=10.0",
    "safetensors>=0.4.3",
    "sentencepiece>=0.2.0",
    "torch>=2.4",
    "transformers>=4.52.0",
]
