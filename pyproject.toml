[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "open-wam"
version = "0.1.0"
description = "Extensible world-action-model training and evaluation with a LingBot-compatible visual core."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Open-WAM contributors" },
]
keywords = ["robotics", "world action models", "world models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Documentation = "https://daivdyuan.github.io/Open-WAM/"
Issues = "https://github.com/DaivdYuan/Open-WAM/issues"
Repository = "https://github.com/DaivdYuan/Open-WAM"

[project.scripts]
open-wam-train = "open_wam.cli.train:main"
open-wam-eval = "open_wam.cli.eval:main"
open-wam-inspect-config = "open_wam.cli.inspect_config:main"
open-wam-validate-config = "open_wam.cli.validate_config:main"
open-wam-sanity = "open_wam.cli.sanity:main"
open-wam-sim-rollout = "open_wam.cli.sim_rollout:main"

[project.optional-dependencies]
core = []
torch = [
    "diffusers>=0.35.0,<0.38",
    "einops>=0.8.0",
    "huggingface_hub>=0.30",
    "msgpack>=1.2.1",
    "numpy>=1.26",
    "pillow>=12.3.0",
    "safetensors>=0.4.3",
    "sentencepiece>=0.2.0",
    "torch>=2.4",
    "transformers>=5.5.0",
]
train = [
    "accelerate>=1.1.0",
    "diffusers>=0.35.0,<0.38",
    "einops>=0.8.0",
    "h5py>=3.11.0",
    "huggingface_hub>=0.30",
    "imageio>=2.36.0",
    "imageio-ffmpeg>=0.6.0",
    "msgpack>=1.2.1",
    "numpy>=1.26",
    "pillow>=12.3.0",
    "pyarrow>=18.0",
    "safetensors>=0.4.3",
    "sentencepiece>=0.2.0",
    "torch>=2.4",
    "transformers>=5.5.0",
]
eval = [
    "diffusers>=0.35.0,<0.38",
    "einops>=0.8.0",
    "h5py>=3.11.0",
    "huggingface_hub>=0.30",
    "imageio>=2.36.0",
    "imageio-ffmpeg>=0.6.0",
    "matplotlib>=3.10.8",
    "msgpack>=1.2.1",
    "numpy>=1.26",
    "pillow>=12.3.0",
    "pyarrow>=18.0",
    "safetensors>=0.4.3",
    "sentencepiece>=0.2.0",
    "torch>=2.4",
    "transformers>=5.5.0",
]
tracking = [
    "wandb>=0.25.1",
]
viz = [
    "imageio>=2.36.0",
    "imageio-ffmpeg>=0.6.0",
    "matplotlib>=3.10.8",
    "mujoco>=3.4",
    "numpy>=1.26",
]
# Keep Hydra >=1.3.4 across simulator extras: it is the first release that
# fixes the high-severity arbitrary-code-execution advisory GHSA-2cp2-2r3c-7p7r.
libero = [
    "bddl==1.0.1",
    "cloudpickle>=3.1.2",
    "easydict>=1.13",
    "future>=1.0.0",
    "gym==0.25.2",
    "hydra-core>=1.3.4",
    "robosuite==1.4.0",
    "termcolor>=3.3.0",
]
calvin = [
    "cloudpickle>=3.1.2",
    "gym==0.25.2",
    "hydra-core>=1.3.4",
    "numpy>=1.26",
]
robotwin = [
    "cloudpickle>=3.1.2",
    "numpy>=1.26",
]
sim = [
    "bddl==1.0.1",
    "cloudpickle>=3.1.2",
    "diffusers>=0.35.0,<0.38",
    "easydict>=1.13",
    "einops>=0.8.0",
    "future>=1.0.0",
    "gym==0.25.2",
    "h5py>=3.11.0",
    "huggingface_hub>=0.30",
    "hydra-core>=1.3.4",
    "imageio>=2.36.0",
    "imageio-ffmpeg>=0.6.0",
    "msgpack>=1.2.1",
    "numpy>=1.26",
    "pillow>=12.3.0",
    "pyarrow>=18.0",
    "robosuite==1.4.0",
    "safetensors>=0.4.3",
    "sentencepiece>=0.2.0",
    "termcolor>=3.3.0",
    "torch>=2.4",
    "transformers>=5.5.0",
]
docs = [
    "mkdocs==1.6.1",
]
full = [
    "accelerate>=1.1.0",
    "bddl==1.0.1",
    "cloudpickle>=3.1.2",
    "diffusers>=0.35.0,<0.38",
    "easydict>=1.13",
    "einops>=0.8.0",
    "future>=1.0.0",
    "gym==0.25.2",
    "h5py>=3.11.0",
    "huggingface_hub>=0.30",
    "hydra-core>=1.3.4",
    "imageio>=2.36.0",
    "imageio-ffmpeg>=0.6.0",
    "matplotlib>=3.10.8",
    "mkdocs==1.6.1",
    "msgpack>=1.2.1",
    "mujoco>=3.4",
    "numpy>=1.26",
    "opencv-python>=4.10.0",
    "pillow>=12.3.0",
    "pyarrow>=18.0",
    "robosuite==1.4.0",
    "safetensors>=0.4.3",
    "sentencepiece>=0.2.0",
    "termcolor>=3.3.0",
    "torch>=2.4",
    "transformers>=5.5.0",
    "wandb>=0.25.1",
]

[dependency-groups]
dev = [
    "pyflakes==3.4.0",
    "pytest>=9.0.3",
]
audit = [
    "pip-audit==2.10.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/open_wam"]

[tool.hatch.build.targets.wheel.force-include]
"configs/artifacts.sample.yaml" = "open_wam/resources/configs/artifacts.sample.yaml"
"configs/evals" = "open_wam/resources/configs/evals"
"configs/examples" = "open_wam/resources/configs/examples"
"configs/experiments" = "open_wam/resources/configs/experiments"
"configs/local_paths.sample.yaml" = "open_wam/resources/configs/local_paths.sample.yaml"
"notes/index/lerobot_consortium_hf_dataset_contracts.json" = "open_wam/resources/consortium/lerobot_consortium_hf_dataset_contracts.json"
"notes/index/lerobot_consortium_hf_dataset_inventory.csv" = "open_wam/resources/consortium/lerobot_consortium_hf_dataset_inventory.csv"
"notes/index/lerobot_consortium_hf_dataset_inventory.md" = "open_wam/resources/consortium/lerobot_consortium_hf_dataset_inventory.md"
"notes/index/lerobot_consortium_hf_repo_ids.txt" = "open_wam/resources/consortium/lerobot_consortium_hf_repo_ids.txt"

[tool.hatch.build.targets.sdist]
only-include = [
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "LICENSES",
    "README.md",
    "SECURITY.md",
    "THIRD_PARTY_NOTICES.md",
    "configs",
    "docs",
    "mkdocs.yml",
    "notes/index/lerobot_consortium_hf_dataset_contracts.json",
    "notes/index/lerobot_consortium_hf_dataset_inventory.csv",
    "notes/index/lerobot_consortium_hf_dataset_inventory.md",
    "notes/index/lerobot_consortium_hf_repo_ids.txt",
    "pyproject.toml",
    "src/open_wam",
]
exclude = [
    "/.grimp_cache",
    "/.gitignore",
    "/configs/local_paths.yaml",
    "/notes/*.tmp.md",
]

[tool.uv]
package = true
