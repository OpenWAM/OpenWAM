name: publish-pypi

# Neither staging promotion nor a main push publishes a package.
on:
  workflow_dispatch:
    inputs:
      index:
        description: Package index (run against the reviewed release tag)
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi
      project:
        description: Publish one project (publish openwam before its aliases)
        required: true
        type: choice
        default: openwam
        options:
          - openwam
          - open-wam
          - openwam-sdk
          - open-wam-sdk

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.index }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-ref:
    if: github.repository == 'OpenWAM/OpenWAM' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require a version-matched tag from production main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python scripts/build_pypi_distributions.py --check-tag "$RELEASE_REF"

  checks:
    needs: verify-ref
    uses: ./.github/workflows/release-checks.yml
    with:
      release: true

  publish:
    needs: checks
    runs-on: ubuntu-latest
    # Pending PyPI projects need distinct identities; protect each environment.
    environment:
      name: ${{ inputs.project == 'openwam' && inputs.index || format('{0}-{1}', inputs.index, inputs.project) }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist
      - name: Select the reviewed project distributions
        env:
          RELEASE_PROJECT: ${{ inputs.project }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_PROJECT" in
            openwam) directory=dist/core ;;
            open-wam|openwam-sdk|open-wam-sdk) directory=dist/aliases ;;
            *) echo "Unsupported release project" >&2; exit 1 ;;
          esac
          name="${RELEASE_PROJECT//-/_}"
          version="${RELEASE_TAG#v}"
          shopt -s nullglob
          wheels=("$directory/$name-$version-"*.whl)
          sdist="$directory/$name-$version.tar.gz"
          if [[ ${#wheels[@]} -ne 1 || ! -f "$sdist" ]]; then
            echo "Expected one wheel and source archive for $RELEASE_PROJECT $version" >&2
            exit 1
          fi
          mkdir upload
          cp -- "${wheels[0]}" "$sdist" upload/
      - name: Publish selected project
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: ${{ inputs.index == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          packages-dir: upload/
          skip-existing: true
