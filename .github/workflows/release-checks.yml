name: release-checks

on:
  workflow_dispatch:
    inputs:
      release:
        description: Enforce dated metadata and the public model-artifact gate
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Check release metadata
        env:
          OPEN_WAM_FINAL_RELEASE: ${{ github.event_name == 'push' || inputs.release }}
        run: |
          if [[ "${OPEN_WAM_FINAL_RELEASE}" == "true" ]]; then
            python scripts/check_release_metadata.py --release
          else
            python scripts/check_release_metadata.py
          fi
      - name: Audit frozen full environment
        run: uv run --frozen --group audit python scripts/check_dependency_audit.py
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate distributions
        run: |
          python scripts/check_release_metadata.py --dist-dir dist
          python -m twine check dist/*
