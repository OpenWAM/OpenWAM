name: pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OPEN_WAM_CI_NO_TORCH: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install docs builder
        run: python -m pip install "mkdocs==1.6.1"
      - name: Stage sanitized docs
        run: python scripts/build_docs_site.py --output .docs_site
      - name: Assert docs build stays dependency-light
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("torch") is None
          PY
      - name: Build static site
        run: mkdocs build --clean
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
