name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  basic-pathways:
    runs-on: ubuntu-latest
    env:
      OPEN_WAM_CI_NO_TORCH: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lockfile is current
        run: uv lock --check
      - name: Whitespace check
        run: git diff --check
      - name: Production-core static lint
        run: uv run --no-project --with pyflakes==3.4.0 python -m pyflakes src scripts tests baselines
      - name: Basic package, config, registry, and CLI pathway checks
        # Static stdlib-only checks. Do not install project deps, run pytest, import open_wam, or install Torch here.
        run: python scripts/ci_basic_sanity.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit frozen full environment
        run: uv run --frozen --group audit python scripts/check_dependency_audit.py

  minimal-package:
    runs-on: ubuntu-latest
    env:
      OPEN_WAM_CI_NO_TORCH: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal package
        run: |
          python -m venv .ci-minimal
          .ci-minimal/bin/python -m pip install --upgrade pip
          .ci-minimal/bin/pip install .
      - name: Import and CLI parser safety
        run: |
          .ci-minimal/bin/python - <<'PY'
          import importlib.util
          import open_wam
          import open_wam.configs
          import open_wam.contracts
          import open_wam.runtime
          import open_wam.pipelines
          assert importlib.util.find_spec("torch") is None
          assert open_wam.__version__
          PY
          .ci-minimal/bin/open-wam-train --help
          .ci-minimal/bin/open-wam-eval --help
          .ci-minimal/bin/open-wam-sanity --help
          .ci-minimal/bin/open-wam-sim-rollout --help
          .ci-minimal/bin/open-wam-validate-config --help
      - name: Static config validation from installed package
        run: |
          VENV="$GITHUB_WORKSPACE/.ci-minimal"
          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"
          mkdir -p configs/experiments src/open_wam
          printf '[project]\nname = "open-wam"\n' > pyproject.toml
          printf 'not: open-wam\n' > configs/experiments/unrelated-shadow.yaml
          "$VENV/bin/python" - <<'PY'
          from open_wam.configs import (
              resolve_config_reference,
              resolve_evaluation_config_reference,
              resolve_experiment_config_reference,
          )

          experiment = resolve_experiment_config_reference("dual_expert_robotwin_smoke")
          assert experiment.is_file()
          assert "site-packages/open_wam/resources" in str(experiment)
          assert resolve_evaluation_config_reference("dual_expert_robotwin_smoke").is_file()
          assert resolve_config_reference(
              "templates/extension_method/config.yaml"
          ).is_file()
          PY
          "$VENV/bin/open-wam-validate-config" \
            configs/experiments/dual_expert_robotwin_smoke.yaml \
            configs/evals/dual_expert_robotwin_smoke_eval.yaml \
            configs/examples/calvin_npz_raw7_sanity.yaml

  semantic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the CPU semantic test stack
        run: uv sync --frozen --group dev --extra full
      - name: Run the required CPU semantic gate
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: >-
          uv run pytest --strict-markers -q
          -m "not (gpu or sim or data or slow)"
      - name: Build and exercise installed wheel
        if: matrix.python-version == '3.11'
        run: |
          uv build --wheel --out-dir .ci-dist
          uv pip install --target .ci-wheel --no-deps .ci-dist/*.whl
          WORKDIR="$(mktemp -d)"
          cd "${WORKDIR}"
          PYTHONPATH="${GITHUB_WORKSPACE}/.ci-wheel" \
            "${GITHUB_WORKSPACE}/.venv/bin/python" \
            "${GITHUB_WORKSPACE}/scripts/check_installed_distribution.py" \
            --expected-package-root "${GITHUB_WORKSPACE}/.ci-wheel"

  docs-site:
    runs-on: ubuntu-latest
    env:
      OPEN_WAM_CI_NO_TORCH: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install docs builder only
        run: python -m pip install "mkdocs==1.6.1"
      - name: Stage public docs
        run: python scripts/build_docs_site.py --output .docs_site
      - name: Assert docs check stays dependency-light
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("torch") is None
          PY
      - name: Build docs site
        run: mkdocs build --clean
