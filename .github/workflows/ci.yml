name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  basic-pathways:
    runs-on: ubuntu-latest
    env:
      OPEN_WAM_CI_NO_TORCH: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lockfile is current
        run: uv lock --check
      - name: Whitespace check
        run: git diff --check
      - name: Production-core static lint
        run: uv run --no-project --with pyflakes==3.4.0 python -m pyflakes src scripts tests baselines templates
      - name: Basic package, config, registry, and CLI pathway checks
        # Static stdlib-only checks. Do not install project deps, run pytest, import open_wam, or install Torch here.
        run: python scripts/ci_basic_sanity.py

  minimal-package:
    runs-on: ubuntu-latest
    env:
      OPEN_WAM_CI_NO_TORCH: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal package
        run: |
          python -m venv .ci-minimal
          .ci-minimal/bin/python -m pip install --upgrade pip
          .ci-minimal/bin/pip install .
      - name: Import and CLI parser safety
        run: |
          .ci-minimal/bin/python - <<'PY'
          import importlib.util
          import open_wam
          import open_wam.configs
          import open_wam.contracts
          import open_wam.runtime
          import open_wam.pipelines
          assert importlib.util.find_spec("torch") is None
          assert open_wam.__version__
          PY
          .ci-minimal/bin/open-wam-train --help
          .ci-minimal/bin/open-wam-eval --help
          .ci-minimal/bin/open-wam-sanity --help
          .ci-minimal/bin/open-wam-sim-rollout --help
          .ci-minimal/bin/open-wam-validate-config --help
      - name: Static config validation from installed package
        run: |
          .ci-minimal/bin/open-wam-validate-config \
            configs/experiments/contract_only_robotwin.yaml \
            configs/evals/contract_only_robotwin.yaml \
            configs/examples/calvin_npz_raw7_sanity.yaml

  docs-site:
    runs-on: ubuntu-latest
    env:
      OPEN_WAM_CI_NO_TORCH: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install docs builder only
        run: python -m pip install "mkdocs==1.6.1"
      - name: Stage sanitized docs
        run: python scripts/build_docs_site.py --output .docs_site
      - name: Assert docs check stays dependency-light
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("torch") is None
          PY
      - name: Build docs site
        run: mkdocs build --clean

  hardware-workspace-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install no-hardware test dependencies
        run: python -m pip install "numpy>=1.26" "pyyaml>=6.0" "pytest>=8.3" "pyflakes==3.4.0"
      - name: Assert model and ROS stacks remain absent
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("torch") is None
          assert importlib.util.find_spec("rclpy") is None
          PY
      - name: Compile hardware workspace
        run: python -m compileall -q deployment
      - name: Lint hardware workspace
        run: python -m pyflakes deployment
      - name: Run no-hardware tests
        run: pytest deployment/tests -q
