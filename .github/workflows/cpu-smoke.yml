name: cpu-smoke

on:
  workflow_dispatch:

jobs:
  public-tiny-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Torch-backed train/eval stack
        run: uv sync --group dev --extra train
      - name: Validate public tiny configs
        run: |
          uv run open-wam-validate-config \
            configs/examples/public_tiny_synthetic_contract.yaml \
            configs/evals/public_tiny_synthetic_contract.yaml
      - name: Train and checkpoint public tiny
        run: |
          RUN_ROOT="${RUNNER_TEMP}/public-tiny"
          uv run open-wam-train \
            --cfg configs/examples/public_tiny_synthetic_contract.yaml \
            --save-root "${RUN_ROOT}" \
            --expected-world-size 1 \
            --disable-wandb
      - name: Resume public tiny exactly
        run: |
          RUN_ROOT="${RUNNER_TEMP}/public-tiny"
          uv run open-wam-train \
            --cfg configs/examples/public_tiny_synthetic_contract.yaml \
            --save-root "${RUN_ROOT}" \
            --resume-from "${RUN_ROOT}" \
            --num-steps 2 \
            --expected-world-size 1 \
            --disable-wandb
      - name: Evaluate the resumed checkpoint
        run: |
          RUN_ROOT="${RUNNER_TEMP}/public-tiny"
          uv run open-wam-eval \
            --cfg configs/evals/public_tiny_synthetic_contract.yaml \
            --checkpoint "${RUN_ROOT}/checkpoints/checkpoint_step_2/model_state.pt" \
            --device cpu \
            --max-batches 1
      - name: Run the packaged extension scaffold
        run: |
          uv run open-wam-train \
            --cfg templates/extension_method/config.yaml \
            --extension open_wam.templates.extension_method \
            --save-root "${RUNNER_TEMP}/extension-method" \
            --disable-wandb
