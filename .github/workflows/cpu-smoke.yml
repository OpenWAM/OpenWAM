name: cpu-smoke

on:
  workflow_dispatch:

jobs:
  public-tiny-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Torch-backed train/eval stack
        run: uv sync --group dev --extra train
      - name: Validate public tiny configs
        run: |
          uv run open-wam-validate-config \
            configs/examples/public_tiny_synthetic_contract.yaml \
            configs/evals/public_tiny_synthetic_contract.yaml
      - name: Run public tiny eval smoke
        run: |
          uv run open-wam-eval \
            --cfg configs/evals/public_tiny_synthetic_contract.yaml \
            --device cpu \
            --max-batches 1
