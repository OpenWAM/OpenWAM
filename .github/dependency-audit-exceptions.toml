[[exceptions]]
id = "PYSEC-2025-194"
package = "torch"
version = "2.11.0"
expires = 2026-11-06
reason = "The advisory describes torch.jit.script memory corruption in PyTorch 2.6. OpenWAM does not compile or load TorchScript; upgrading the characterized 2.11 tensor runtime requires a separate numerical-parity migration."

[[exceptions]]
id = "PYSEC-2026-3447"
package = "setuptools"
version = "81.0.0"
expires = 2026-11-06
reason = "The advisory affects Setuptools MANIFEST.in processing on normalization-preserving filesystems. OpenWAM builds distributions with Hatchling; Setuptools is present only because Torch declares it as a runtime dependency."
