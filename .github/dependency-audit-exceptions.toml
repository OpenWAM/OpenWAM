[[exceptions]]
id = "PYSEC-2026-40"
package = "diffusers"
version = "0.37.1"
expires = 2026-11-06
reason = "The advisory affects remote custom-code loading through DiffusionPipeline.from_pretrained. Open-WAM does not use DiffusionPipeline and loads AutoencoderKLWan only from validated local component directories; 0.38 changes WAN bf16 normalization and fails the immutable model-parity gate."

