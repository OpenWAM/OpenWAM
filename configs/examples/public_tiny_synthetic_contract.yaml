name: public_tiny_synthetic_contract

data:
  dataset_name: public_tiny
  dataset_type: synthetic_multiview
  camera_names: [camera_0]
  latent_camera_names: [camera_0]
  canonical_height: 64
  canonical_width: 64
  view_layout:
    - source_name: camera_0
      canonical_name: camera_0
      top: 0
      left: 0
      height: 64
      width: 64
  num_frames: 2
  frame_stride: 1
  sample_stride: 1
  train_batch_size: 1
  val_batch_size: 1
  num_workers: 0
  action_schema:
    action_dim: 4
    action_horizon: 2
    state_dim: 3
    state_horizon: 1

backbone:
  implementation: shared_transformer
  hidden_size: 32
  num_layers: 1
  num_heads: 4
  attention_head_dim: 8
  ffn_dim: 128

policy_variant:
  name: dual_expert
  hidden_size: 32
  attach_site: post_visual_core
  preset: fastwam
  program: video_then_action
  action_expert_init_mode: random
  num_action_layers: 1
  action_hidden_size: 32
  use_text_conditioning: false
  use_state_conditioning: false

action_decoder:
  name: dual_expert_decoder
  hidden_size: 32
  action_dim: 4
  action_horizon: 2

training:
  video_num_train_timesteps: 8
  action_num_train_timesteps: 8
  video_sigma_shift: 1.0
  action_sigma_shift: 1.0
  use_teacher_forcing: false
  enabled_objectives: [action]
  trainable_components: [policy_variant.action_expert]
  num_steps: 1

inference:
  video_num_inference_steps: 2
  action_num_inference_steps: 2
  use_cache: false
  guidance_scale: 1.0

trainer:
  # This fixture intentionally exercises the complete public checkpoint and
  # exact-resume lifecycle while remaining CPU-safe.
  max_epochs: 1
  limit_train_batches: 1
  limit_val_batches: 1
  log_every_n_steps: 1
  accelerator: cpu
  devices: 1
  precision: 32-true
  loop_policy: steps
  enable_checkpointing: true
  save_interval: 1
  checkpoint_mode: full_training_state
  enable_model_summary: false
