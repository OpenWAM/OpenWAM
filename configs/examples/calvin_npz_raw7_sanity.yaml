name: calvin_npz_raw7_sanity

data:
  dataset_name: calvin
  dataset_type: calvin_npz
  local_root: ${paths.datasets.calvin_root}
  camera_names: [rgb_static, rgb_gripper]
  canonical_height: 384
  canonical_width: 320
  num_frames: 2
  frame_stride: 1
  sample_stride: 1
  train_batch_size: 1
  val_batch_size: 1
  num_workers: 0
  action_schema:
    action_dim: 7
    action_horizon: 3
    state_dim: 15
    state_horizon: 1
  action_target:
    representation: raw
    source_key: rel_actions
    pose_source_key: robot_obs

backbone:
  implementation: shared_transformer
  train_attn_mode: torch
  infer_attn_mode: torch
  hidden_size: 256
  num_layers: 1
  num_heads: 8
  attention_head_dim: 32
  ffn_dim: 1024

policy_variant:
  name: dual_expert
  hidden_size: 256
  attach_site: post_visual_core
  preset: fastwam
  program: video_then_action
  action_expert_init_mode: random
  num_action_layers: 1
  action_hidden_size: 256
  use_text_conditioning: false
  use_state_conditioning: false

action_decoder:
  name: dual_expert_decoder
  hidden_size: 256
  action_dim: 7
  action_horizon: 3

training:
  video_num_train_timesteps: 1000
  action_num_train_timesteps: 1000
  video_sigma_shift: 5.0
  action_sigma_shift: 1.0
  use_teacher_forcing: false
  enabled_objectives: [action]
  trainable_components: [policy_variant.action_expert]

inference:
  video_num_inference_steps: 4
  action_num_inference_steps: 4
  use_cache: true
  guidance_scale: 1.0

trainer:
  max_epochs: 1
  limit_train_batches: 1
  limit_val_batches: 1
  log_every_n_steps: 1
  accelerator: cpu
  devices: 1
  precision: 32-true
  enable_checkpointing: false
  enable_model_summary: false
