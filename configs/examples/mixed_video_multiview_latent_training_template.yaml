# Template for latent-first mixed-video pretraining with per-view sidecars.
#
# Produce the sidecars with scripts/encode_mixed_video_latents.py from a matching
# RGB config that sets `data.latent_encoding_mode: per_view`. The encoder writes
# a generated `latent_training_config.yaml`; this file shows the same contract in
# checked-in form for manual multi-dataset edits.

name: mixed_video_multiview_latent_training_template

data:
  dataset_name: mixed_video
  dataset_type: mixed_video
  video_sources:
    - source_id: dataset_d
      manifest_csv: /path/to/encoded/manifests/dataset_d.csv
      source_format: latent
      latent_key: video_latents

  # Per-view sidecars keep one latent stream per slot. The slot names only need
  # to match manifest `target_slot_key` values; they do not need to be globally
  # semantic across datasets.
  camera_names:
    - observation.images.slot0
    - observation.images.slot1
  latent_camera_names:
    - observation.images.slot0
    - observation.images.slot1
  latent_encoding_mode: per_view

  # Omit latent_view_combinations for the efficient default: one all-available
  # combination per episode, e.g. slot0+slot1 for two-view episodes. Add explicit
  # combinations only for ablations. Their sampling_weight values are
  # repeat-count ratios, and source balancing is applied after this expansion.
  #
  # latent_view_combinations:
  #   - name: d_slot0
  #     slots: [observation.images.slot0]
  #     sampling_weight: 1.0
  #     source_ids: [dataset_d]
  #   - name: d_slot1
  #     slots: [observation.images.slot1]
  #     sampling_weight: 1.0
  #     source_ids: [dataset_d]
  #   - name: d_slot0_slot1
  #     slots: [observation.images.slot0, observation.images.slot1]
  #     sampling_weight: 2.0
  #     source_ids: [dataset_d]

  canonical_height: 128
  canonical_width: 128
  view_layout:
    - source_name: observation.images.slot0
      canonical_name: observation.images.slot0
      top: 0
      left: 0
      height: 128
      width: 128
    - source_name: observation.images.slot1
      canonical_name: observation.images.slot1
      top: 0
      left: 0
      height: 128
      width: 128

  num_frames: 5
  frame_stride: 1
  sample_stride: 1
  train_fraction: 0.98
  train_batch_size: 1
  val_batch_size: 1
  num_workers: 4
  random_mode: within_source
  weight_mode: proportional_to_size
  sampling_seed: 0
  action_schema:
    action_dim: 1
    action_horizon: 0
    state_dim: 1
    state_horizon: 0
  action_target:
    representation: raw
    source_key: action
    pose_source_key: observation.state
  sample_construction:
    mode: causal_prefix_suffix
    num_frames: 5
    action_horizon: 0
    state_horizon: 0
    frame_stride: 1
    causal_prefix_suffix_buckets:
      - observed_frames: 2
        future_frames: 3

backbone:
  implementation: shared_transformer
  pretrained_model_name_or_path: "${paths.models.lingbot_va_base}"
  hidden_size: 3072
  num_layers: 30
  num_heads: 24
  attention_head_dim: 128
  ffn_dim: 14336
  text_dim: 4096
  max_text_tokens: 512
  patch_size_t: 1
  patch_size_h: 2
  patch_size_w: 2
  load_wan_vae_frontend: false
  load_text_conditioning: false
  load_reference_core_weights: true
  transformer_subdir: transformer
  reference_core_init_mode: video_only

policy_variant:
  name: causal_video_prediction
  attach_site: post_visual_core
  hidden_size: 256

action_decoder:
  name: video_only_decoder
  hidden_size: 256
  action_dim: 1
  action_horizon: 0

training:
  learning_rate: 1.0e-5
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 20
  num_steps: 5000
  chunk_size: 2
  window_size: 8
  enabled_objectives: [latent]
  latent_loss_weight: 1.0
  action_loss_weight: 0.0
  trainable_components: [visual_tower.runtime_backbone]

inference:
  video_num_inference_steps: 20
  guidance_scale: 1.0
  use_cache: false
  frame_chunk_size: 1

trainer:
  runtime: composable
  batch_adapter: latents
  loop_policy: steps
  strategy: fsdp
  accelerator: gpu
  precision: bf16-mixed
  default_root_dir: "${paths.outputs.train_runs_root}"
  save_interval: 100
  export_runtime_backbone: true
  enable_wandb: true
  wandb_project: openwam-mixed-video-pretrain
