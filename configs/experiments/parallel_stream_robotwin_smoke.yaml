name: parallel_stream_robotwin_smoke

data:
  # Minimal smoke-test dataset knobs
  dataset_name: robotwin
  camera_names: [cam_high, cam_left_wrist, cam_right_wrist]
  canonical_height: 384
  canonical_width: 320
  num_frames: 4
  # Shared action/state schema knobs
  action_schema:
    action_dim: 30
    action_horizon: 8
    state_dim: 30
    state_horizon: 1

backbone:
  # Small backbone geometry for fast local verification
  implementation: shared_transformer
  train_attn_mode: flex
  infer_attn_mode: torch
  hidden_size: 256
  num_layers: 1
  num_heads: 8
  attention_head_dim: 32
  ffn_dim: 1024

policy_variant:
  # Exact parallel-stream chunk layout knobs
  name: parallel_stream
  program: video_then_action
  hidden_size: 256
  frame_chunk_size: 2
  action_per_frame: 2
  attn_window: 8
  sequence_order: [video_noisy, video_condition, action_noisy, action_condition]
  mask_mode: lingbot_chunked
  cache_mode: metadata_only

action_decoder:
  # LingBot-compatible action decoder for smoke validation
  name: parallel_stream_decoder
  hidden_size: 256
  action_dim: 30
  action_horizon: 8

training:
  # Training-noise and windowing knobs
  video_num_train_timesteps: 1000
  action_num_train_timesteps: 1000
  video_sigma_shift: 5.0
  action_sigma_shift: 1.0
  use_teacher_forcing: false
  chunk_size: 2
  window_size: 8

inference:
  # Short rollout knobs for quick inference smoke tests
  video_num_inference_steps: 4
  action_num_inference_steps: 4
  frame_chunk_size: 2
  use_cache: true
  guidance_scale: 1.0

trainer:
  # Small single-process smoke-test runtime knobs
  max_epochs: 1
  limit_train_batches: 2
  limit_val_batches: 1
  log_every_n_steps: 1
  accelerator: cpu
  devices: 1
  precision: 32-true
  enable_checkpointing: false
  enable_model_summary: false
