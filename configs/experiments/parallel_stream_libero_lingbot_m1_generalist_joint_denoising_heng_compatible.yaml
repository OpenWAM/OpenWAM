name: parallel_stream_libero_lingbot_m1_generalist_joint_denoising_heng_compatible

data:
  # Dataset source knobs
  dataset_name: libero
  dataset_type: lerobot_v2_latent_local
  local_root: "${paths.datasets.libero_heng_root}"
  replay_status_path: "${paths.datasets.libero_replay_status_path}"
  replay_status_policy: successful_only
  val_replay_status_policy: failure_only
  require_replay_status: true
  val_require_replay_status: true
  empty_text_embedding_path: "${paths.datasets.empty_text_embedding}"
  split: train
  # View + latent layout knobs
  camera_names: [observation.images.agentview_rgb, observation.images.eye_in_hand_rgb]
  latent_camera_names: [observation.images.agentview_rgb, observation.images.eye_in_hand_rgb]
  canonical_height: 128
  canonical_width: 256
  num_frames: 4
  frame_stride: 1
  sample_stride: 1
  episode_cache_size: 2
  train_fraction: 1.0
  split_seed: 0
  # Strict fixed-128 rollout-parity segments. One real context frame is
  # materialized before the 128 supervised targets. Tail overflow remains
  # metadata-only, unavailable targets are masked, and chunk geometry is fixed at 4.
  sample_construction:
    mode: hierarchical_fixed_segment
    segment_frames: 128
    chunk_size: 4
    window_size: 30
    randomize_geometry: false
    start_padding_frames: 0
    target_alignment: next_after_context
    rollout_context_policy: one_frame
    tail_padding_policy: zero_order_hold
    padded_target_policy: mask_loss
    task_start_power: 0.5
    demo_count_power: 0.0
    trajectory_start_power: 1.0
  train_batch_size: 1
  val_batch_size: 1
  num_workers: 8
  view_layout:
    - source_name: observation.images.agentview_rgb
      canonical_name: image
      top: 0
      left: 0
      height: 128
      width: 128
    - source_name: observation.images.eye_in_hand_rgb
      canonical_name: wrist_image
      top: 0
      left: 128
      height: 128
      width: 128
  action_schema:
    action_dim: 7
    action_horizon: 16
    state_dim: 8
    state_horizon: 1
  action_target:
    representation: raw
    source_key: action
    pose_source_key: observation.state
    state_encoding: eef_pos_axisangle_gripper_2d
    reference_source: anchor_state
    rotation_representation: axis_angle
    include_gripper: true
    gripper_representation: action_command
    gripper_action_index: -1
  # Opt-in dynamics mixture for GJD training. Leave roots null for the legacy
  # demo-only sampler; set `policy_variant.generalist_training_paradigm:
  # mixed_dynamics` and point these roots at encoded counterfactual latents to
  # activate the 60/10/10/10/10 real/counterfactual bucket mixer.
  generalist_dynamics_mixture:
    train_latent_root: null
    val_latent_root: null
    allow_train_latent_root_for_val: false
    real_joint_weight: 0.6
    real_action_conditioned_video_weight: 0.1
    real_video_conditioned_action_weight: 0.1
    counterfactual_action_conditioned_video_weight: 0.1
    counterfactual_video_conditioned_action_weight: 0.1
    conditional_history_frames: 16

backbone:
  implementation: shared_transformer
  train_attn_mode: flex
  infer_attn_mode: torch
  hidden_size: 3072
  num_layers: 30
  num_heads: 24
  attention_head_dim: 128
  ffn_dim: 14336
  pretrained_model_name_or_path: "${paths.models.lingbot_va_base}"
  transformer_subdir: "${paths.checkpoints.parallel_stream_joint_libero_step_600_0402}/transformer"
  max_text_tokens: 512
  load_wan_vae_frontend: true
  load_text_conditioning: true
  reference_assets_device_policy: cpu_offload

policy_variant:
  # Method-1 variant 7: generalist joint denoising.
  # The packed noisy video/action slots are authoritative. Conditional modes
  # place the clean supplied modality in its normal noisy slot at timestep 0 and
  # mask that modality's loss.
  name: parallel_stream
  runtime_mode: lingbot_exact_action_conditioned
  variant_profile: generalist_joint_denoising
  generalist_training_paradigm: demo_only
  current_block_coupling: joint
  reference_profile: libero_joint
  hidden_size: 3072
  frame_chunk_size: 4
  action_per_frame: 4
  attn_window: 30
  sequence_order: [video_noisy, video_condition, action_noisy, action_condition]
  mask_mode: lingbot_chunked
  cache_mode: metadata_only
  video_condition_on_action: true
  video_action_condition_source: noisy_action
  video_action_attention_scope: block_local
  # Canonical GJD uses the video scheduler as the single sigma clock for joint,
  # FDM, and IDM modes. Use `match_index`/`independent` only for ablations.
  joint_timestep_coupling: match_sigma
  preserve_video_pretrain_history: true
  joint_denoise_training_mode_probs:
    joint: 0.6
    action_conditioned_video: 0.2
    video_conditioned_action: 0.2

action_decoder:
  name: lingbot_parallel_decoder
  hidden_size: 3072
  action_dim: 30
  action_horizon: 16

training:
  video_num_train_timesteps: 1000
  action_num_train_timesteps: 1000
  video_sigma_shift: 5.0
  action_sigma_shift: 1.0
  use_teacher_forcing: false
  chunk_size: 4
  window_size: 64
  optimizer_name: adamw
  scheduler_name: constant_with_warmup
  learning_rate: 1.0e-5
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  warmup_steps: 10
  gradient_accumulation_steps: 10
  max_grad_norm: 2.0
  num_steps: 5000
  text_condition_dropout_prob: 0.1
  enabled_objectives: [latent, action]
  latent_loss_weight: 1.0
  action_loss_weight: 1.0
  trainable_components: [visual_tower.runtime_backbone]
  sample_loss_weight_mode: valid_action_steps
  sample_loss_weight_reference_steps: null
  sample_loss_weight_min: 0.25
  sample_loss_weight_max: 4.0

inference:
  # Online rollout controls for conditional generation are intentionally later.
  # Current autonomous rollout still uses joint generation with matched steps.
  video_num_inference_steps: 20
  action_num_inference_steps: 20
  frame_chunk_size: 4
  use_cache: true
  guidance_scale: 5.0
  action_guidance_scale: 1.0
  video_exec_step: -1

validation:
  # Auxiliary held-out conditional probes. Primary trainer validation remains
  # disabled below; these tasks run from the validation loop independently.
  auxiliary_tasks:
    - name: fdm_val
      mode_override: action_conditioned_video
      dataset_split: val
      source: counterfactual_dynamics_if_available
      max_batches: 16
      report_prefix: val_fdm
    - name: idm_val
      mode_override: video_conditioned_action
      dataset_split: val
      source: counterfactual_dynamics_if_available
      max_batches: 16
      report_prefix: val_idm

trainer:
  max_epochs: 1
  limit_train_batches: null
  limit_val_batches: 0  # Primary val is off; GJD probes above still run.
  validation_interval: 100
  log_every_n_steps: 1
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  enable_checkpointing: true
  enable_model_summary: false
  runtime: composable
  batch_adapter: latents
  loop_policy: steps
  strategy: fsdp
  save_interval: 100
  checkpoint_mode: full_training_state
  export_runtime_backbone: true
  enable_jsonl_logging: true
  enable_wandb: true
  wandb_project: openwam-method1-libero
  wandb_mode: online
