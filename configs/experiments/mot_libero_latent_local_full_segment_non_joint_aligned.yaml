name: mot_libero_latent_local_full_segment_non_joint_aligned

# Method-1 `lingbot_exact` (non-joint) aligned MoT training.
#
# Both video and action are denoised simultaneously with a
# history-clean / current-noisy split. The attention mask is MoT Branch 1:
# noisy tokens can only attend earlier-block clean tokens (both streams) and
# same-block noisy tokens (same-stream only, because MoT block ids are
# video-even / action-odd).
#
# Architectural delta vs method-1 non-joint: MoT keeps
# `video_can_attend_action=false`, so video never sees action context.
# That is the sole, intentional MoT constraint carried over from method-5.

data:
  dataset_name: libero
  dataset_type: lerobot_v2_latent_local
  local_root: "${paths.datasets.libero_heng_root}"
  empty_text_embedding_path: "${paths.datasets.empty_text_embedding}"
  split: train
  camera_names: [observation.images.agentview_rgb, observation.images.eye_in_hand_rgb]
  latent_camera_names: [observation.images.agentview_rgb, observation.images.eye_in_hand_rgb]
  canonical_height: 128
  canonical_width: 256
  num_frames: 4
  frame_stride: 1
  sample_stride: 1
  sample_construction:
    mode: contextual_subwindow
    num_frames: 4
    action_horizon: 16
    state_horizon: 1
    frame_stride: 1
    chunk_size: 4
    # window_size: 64
    # window_size: 32
    window_size: 16
    predict_blocks_per_sample: 1
    randomize_geometry: true
  episode_cache_size: 2
  train_fraction: 0.95
  split_seed: 0
  train_batch_size: 1
  val_batch_size: 1
  num_workers: 8
  view_layout:
    - source_name: observation.images.agentview_rgb
      canonical_name: image
      top: 0
      left: 0
      height: 128
      width: 128
    - source_name: observation.images.eye_in_hand_rgb
      canonical_name: wrist_image
      top: 0
      left: 128
      height: 128
      width: 128
  action_schema:
    action_dim: 7
    action_horizon: 16
    state_dim: 8
    state_horizon: 1
  action_target:
    representation: raw
    source_key: action
    pose_source_key: observation.state
    state_encoding: eef_pos_axisangle_gripper_2d
    reference_source: anchor_state
    rotation_representation: axis_angle
    include_gripper: true
    gripper_representation: action_command
    gripper_action_index: -1

backbone:
  # Shared Wan/LingBot-compatible video backbone. The two-stream non-joint
  # path trains the backbone together with the action expert, so the starting
  # point matters; point `transformer_subdir` at a LIBERO video-only
  # pretrain when available (e.g. the `causal_video_prediction_libero_...`
  # export).
  implementation: shared_transformer
  train_attn_mode: flex
  infer_attn_mode: torch
  hidden_size: 3072
  num_layers: 30
  num_heads: 24
  attention_head_dim: 128
  ffn_dim: 14336
  pretrained_model_name_or_path: "${paths.models.lingbot_va_base}"
  transformer_subdir: transformer
  max_text_tokens: 512
  load_wan_vae_frontend: true
  load_text_conditioning: true
  load_reference_core_weights: true
  reference_core_init_mode: video_only
  reference_assets_device_policy: cpu_offload

policy_variant:
  # Non-joint two-stream MoT: both streams share the history-clean /
  # current-noisy layout; cross-stream same-block noisy attention is
  # disallowed by the block-id scheme (video even, action odd).
  name: mot
  hidden_size: 3072
  attach_site: post_visual_core
  preset: fastwam_non_joint
  runtime_mode: non_joint_two_stream
  condition_mode: teacher_forcing_cond_video
  video_prefix_frames: 1
  action_expert_init_mode: video_weight_interpolate
  num_action_layers: 30
  # action_hidden_size: 1024
  # action_ffn_dim: 4096
  action_hidden_size: 2048
  action_ffn_dim: 8192
  video_can_attend_action: false
  use_text_conditioning: true
  use_state_conditioning: false
  # Recompute each (video, action) block pair at backward time to free
  # activations. ~1.3x slower forward but saves tens of GB on two-stream
  # training -- required to fit 4x44GB GPUs at this geometry.
  use_activation_checkpointing: true

action_decoder:
  name: mot_decoder
  hidden_size: 3072
  action_dim: 7
  action_horizon: 16

training:
  # Method-1-non-joint-aligned MoT: both streams carry loss and both
  # trainable sets receive gradients. `chunk_size` / `window_size` mirror
  # the contextual_subwindow sampler caps.
  video_num_train_timesteps: 1000
  action_num_train_timesteps: 1000
  video_sigma_shift: 5.0
  action_sigma_shift: 1.0
  use_teacher_forcing: false
  chunk_size: 4
  # window_size: 64
  # window_size: 32
  window_size: 16
  optimizer_name: adamw
  scheduler_name: constant_with_warmup
  learning_rate: 1.0e-5
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  warmup_steps: 10
  gradient_accumulation_steps: 10
  max_grad_norm: 2.0
  num_steps: 5000
  text_condition_dropout_prob: 0.1
  enabled_objectives: [action, latent]
  latent_loss_weight: 1.0
  action_loss_weight: 1.0
  trainable_components: [policy_variant.action_expert, visual_tower.runtime_backbone]

inference:
  video_num_inference_steps: 20
  action_num_inference_steps: 20
  frame_chunk_size: 4
  use_cache: true
  guidance_scale: 5.0

trainer:
  max_epochs: 1
  limit_train_batches: null
  limit_val_batches: 0
  log_every_n_steps: 1
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  enable_checkpointing: true
  enable_model_summary: false
  runtime: composable
  batch_adapter: latents
  loop_policy: steps
  strategy: fsdp
  save_interval: 100
  checkpoint_mode: full_training_state
  export_runtime_backbone: true
  enable_jsonl_logging: true
  enable_wandb: true
  wandb_project: openwam-libero-policy-train
  wandb_mode: online
