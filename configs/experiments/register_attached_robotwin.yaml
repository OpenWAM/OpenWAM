name: register_attached_robotwin

data:
  dataset_name: robotwin
  camera_names: [cam_high, cam_left_wrist, cam_right_wrist]
  canonical_height: 384
  canonical_width: 320
  num_frames: 4
  action_schema:
    action_dim: 30
    action_horizon: 6
    state_dim: 30
    state_horizon: 3

backbone:
  hidden_size: 256
  num_layers: 1
  num_heads: 8

policy_variant:
  name: register_attached
  hidden_size: 256
  num_frame_per_block: 1
  num_action_per_block: 2
  num_state_per_block: 1
  max_chunk_size: 1
  register_layout: action_then_state
  mask_mode: dreamzero_blockwise

action_decoder:
  name: register_decoder
  hidden_size: 256
  action_dim: 30
  action_horizon: 6

training:
  video_num_train_timesteps: 1000
  action_num_train_timesteps: 1000
  video_sigma_shift: 5.0
  action_sigma_shift: 1.0
  use_teacher_forcing: false

inference:
  video_num_inference_steps: 25
  action_num_inference_steps: 50
  use_cache: true
  guidance_scale: 1.0
  frame_chunk_size: 1

trainer:
  max_epochs: 1
  limit_train_batches: 2
  limit_val_batches: 1
  log_every_n_steps: 1
  accelerator: cpu
  devices: 1
  precision: 32-true
  enable_checkpointing: false
  enable_model_summary: false
