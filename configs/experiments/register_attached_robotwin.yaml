# OBSOLETE: traditional Method 2 `register_attached` is disabled. This config is
# kept for historical reference only; pipeline construction raises an explicit
# warning and error.
name: register_attached_robotwin

data:
  dataset_name: robotwin
  camera_names: [cam_high, cam_left_wrist, cam_right_wrist]
  canonical_height: 384
  canonical_width: 320
  num_frames: 4
  action_schema:
    action_dim: 30
    action_horizon: 6
    state_dim: 30
    state_horizon: 3

backbone:
  implementation: lingbot_replica
  hidden_size: 3072
  num_layers: 30
  num_heads: 24
  attention_head_dim: 128
  ffn_dim: 14336
  load_wan_vae_frontend: false
  load_text_conditioning: false
  load_reference_core_weights: false

policy_variant:
  name: register_attached
  hidden_size: 3072
  num_frame_per_block: 1
  num_action_per_block: 2
  num_state_per_block: 1
  max_chunk_size: 1
  register_layout: action_then_state
  mask_mode: dreamzero_blockwise
  couple_action_to_video_blocks: true

action_decoder:
  name: register_decoder
  hidden_size: 3072
  action_dim: 30
  action_horizon: 6

training:
  video_num_train_timesteps: 1000
  action_num_train_timesteps: 1000
  video_sigma_shift: 5.0
  action_sigma_shift: 5.0
  use_teacher_forcing: false

inference:
  video_num_inference_steps: 25
  action_num_inference_steps: 50
  joint_num_inference_steps: 16
  joint_sampler: unipc
  video_cfg_mode: guided
  action_cfg_mode: conditioned
  joint_cache_update_mode: warmup_only
  joint_cache_warmup_source: reference_video
  joint_cache_initial_warmup_anchor: start
  joint_cache_initial_warmup_frames: 1
  joint_cache_rollout_warmup_anchor: end
  joint_cache_rollout_warmup_frames: 1
  joint_observed_video_prefix_frames: 1
  use_cache: true
  guidance_scale: 1.0
  frame_chunk_size: 1

trainer:
  max_epochs: 1
  limit_train_batches: 2
  limit_val_batches: 1
  log_every_n_steps: 1
  accelerator: cpu
  devices: 1
  precision: 32-true
  enable_checkpointing: false
  enable_model_summary: false
