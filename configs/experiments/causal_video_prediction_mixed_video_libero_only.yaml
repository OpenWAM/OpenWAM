# DERIVED from causal_video_prediction_mixed_video.yaml
# WHY: oxe_openvla manifest is not wired yet on this cluster; disabling it
# lets us smoke-test the PR#108 mixed-video pipeline with libero10 only.
# WHAT CHANGED: removed the oxe_openvla video_sources entry. Everything else
# inherits from the base config via YAML merge.

name: causal_video_prediction_mixed_video_libero_only

data:
  dataset_name: mixed_video
  dataset_type: mixed_video
  cache_dir: "${paths.datasets.mixed_video_hf_cache}"
  video_sources:
    # WHY only libero10: oxe_openvla manifest path is not staged on this cluster
    - source_id: libero10
      manifest_csv: "${paths.datasets.mixed_video_libero_manifest}"
      sampling_weight: 1.0

  camera_names: [observation.images.slot0]
  latent_camera_names: [observation.images.slot0]
  canonical_height: 128
  canonical_width: 128
  view_layout:
    - source_name: observation.images.slot0
      canonical_name: observation.images.slot0
      top: 0
      left: 0
      height: 128
      width: 128
  decode_size_mode: aspect_ratio_bins
  decode_resize_bins:
    - name: square_128
      aspect_width: 1
      aspect_height: 1
      target_height: 128
      target_width: 128
      max_pixels: 16384
    - name: square_256
      aspect_width: 1
      aspect_height: 1
      target_height: 256
      target_width: 256
    - name: four_three_320x240
      aspect_width: 4
      aspect_height: 3
      target_height: 240
      target_width: 320
    - name: sixteen_nine_368x208
      aspect_width: 16
      aspect_height: 9
      target_height: 208
      target_width: 368
  decode_height: 128
  decode_width: 128
  decode_center_crop: true
  decode_allow_upscale: true
  missing_stream_policy: zero_fill

  random_mode: within_source
  weight_mode: proportional_to_size
  sampling_seed: 0

  num_frames: 16
  frame_stride: 1
  sample_stride: 1
  episode_cache_size: 2
  train_fraction: 0.98
  train_batch_size: 1
  val_batch_size: 1
  num_workers: 4
  action_schema:
    action_dim: 1
    action_horizon: 0
    state_dim: 1
    state_horizon: 0
  action_target:
    representation: raw
    source_key: action
    pose_source_key: observation.state
  sample_construction:
    mode: causal_prefix_suffix
    num_frames: 16
    action_horizon: 0
    state_horizon: 0
    frame_stride: 1
    causal_prefix_suffix_buckets:
      - observed_frames: 1
        future_frames: 4
      - observed_frames: 2
        future_frames: 6
      - observed_frames: 5
        future_frames: 10

backbone:
  implementation: shared_transformer
  pretrained_model_name_or_path: "${paths.models.lingbot_va_base}"
  hidden_size: 3072
  num_layers: 30
  num_heads: 24
  attention_head_dim: 128
  ffn_dim: 14336
  text_dim: 4096
  max_text_tokens: 512
  patch_size_t: 1
  patch_size_h: 2
  patch_size_w: 2
  load_wan_vae_frontend: true
  load_text_conditioning: false
  load_reference_core_weights: true
  transformer_subdir: transformer
  reference_core_init_mode: video_only

policy_variant:
  name: causal_video_prediction
  attach_site: post_visual_core
  hidden_size: 256

action_decoder:
  name: video_only_decoder
  hidden_size: 256
  action_dim: 1
  action_horizon: 0

training:
  learning_rate: 1.0e-5
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 20
  num_steps: 5000
  chunk_size: 2
  window_size: 8
  enabled_objectives: [latent]
  latent_loss_weight: 1.0
  action_loss_weight: 0.0
  trainable_components: [visual_tower.runtime_backbone]

inference:
  video_num_inference_steps: 20
  guidance_scale: 1.0
  use_cache: false
  frame_chunk_size: 1

trainer:
  runtime: composable
  batch_adapter: views
  loop_policy: steps
  strategy: fsdp
  accelerator: gpu
  precision: bf16-mixed
  default_root_dir: "${paths.outputs.train_runs_root}"
  save_interval: 100
  export_runtime_backbone: true
  enable_wandb: true
  wandb_project: openwam-mixed-video-pretrain
