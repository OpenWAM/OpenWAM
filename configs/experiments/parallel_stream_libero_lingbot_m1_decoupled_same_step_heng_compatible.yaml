name: parallel_stream_libero_lingbot_m1_decoupled_same_step_heng_compatible

data:
  # Dataset source knobs
  # - pick the dataset family and where samples/latents live locally
  dataset_name: libero
  dataset_type: lerobot_v2_latent_local
  local_root: "${paths.datasets.libero_heng_root}"
  empty_text_embedding_path: "${paths.datasets.empty_text_embedding}"
  split: train
  # View + latent layout knobs
  # - camera_names drive RGB metadata, latent_camera_names drive latent lookup
  camera_names: [observation.images.agentview_rgb, observation.images.eye_in_hand_rgb]
  latent_camera_names: [observation.images.agentview_rgb, observation.images.eye_in_hand_rgb]
  canonical_height: 128
  canonical_width: 256
  num_frames: 4
  frame_stride: 1
  sample_stride: 1
  episode_cache_size: 2
  train_fraction: 1.0
  split_seed: 0
  # Shared fixed-128 hierarchical segments. Boundary starts stay eligible, but
  # compact boundary tensors do not materialize held head/tail frames. Missing
  # actions and padded targets are excluded from loss. chunk_size is the max sampled train chunk
  # (randomized 1..4); window_size keeps the rollout lookback bounded.
  sample_construction:
    mode: hierarchical_fixed_segment
    segment_frames: 128
    chunk_size: 4
    window_size: 30
    randomize_geometry: true
    start_padding_frames: 3
    context_prefix_policy: none
    tail_padding_policy: zero_order_hold
    padded_target_policy: mask_loss
    task_start_power: 0.5
    demo_count_power: 0.0
    trajectory_start_power: 1.0
  train_batch_size: 1
  val_batch_size: 1
  num_workers: 8
  # Canonical canvas placement knobs
  # - each source camera is placed into one fixed region of the shared canvas
  view_layout:
    - source_name: observation.images.agentview_rgb
      canonical_name: image
      top: 0
      left: 0
      height: 128
      width: 128
    - source_name: observation.images.eye_in_hand_rgb
      canonical_name: wrist_image
      top: 0
      left: 128
      height: 128
      width: 128
  # Action/state schema knobs
  action_schema:
    action_dim: 7
    action_horizon: 16
    state_dim: 8
    state_horizon: 1
  # Action-target encoding knobs
  # - representation chooses the target family
  # - *_representation fields choose how pose/gripper state is encoded
  action_target:
    representation: raw
    source_key: action
    pose_source_key: observation.state
    state_encoding: eef_pos_axisangle_gripper_2d
    reference_source: anchor_state
    rotation_representation: axis_angle
    include_gripper: true
    gripper_representation: action_command
    gripper_action_index: -1

backbone:
  # Shared transformer identity + attention knobs
  implementation: shared_transformer
  train_attn_mode: flex
  infer_attn_mode: torch
  hidden_size: 3072
  num_layers: 30
  num_heads: 24
  attention_head_dim: 128
  ffn_dim: 14336
  # Reference asset loading knobs
  # - pretrained_model_name_or_path points at the base LingBot-VA assets
  # - transformer_subdir can point at a posttrain checkpoint transformer export
  pretrained_model_name_or_path: "${paths.models.lingbot_va_base}"
  transformer_subdir: "${paths.checkpoints.parallel_stream_exact_libero_step_400}/transformer"
  max_text_tokens: 512
  load_wan_vae_frontend: true
  load_text_conditioning: true
  reference_assets_device_policy: cpu_offload

policy_variant:
  # Method-1 runtime knobs
  # - these control chunk geometry, rollout layout, and exact-runtime behavior
  name: parallel_stream
  runtime_mode: lingbot_exact
  current_block_coupling: decoupled_same_step
  joint_timestep_coupling: independent
  reference_profile: libero
  hidden_size: 3072
  frame_chunk_size: 4
  action_per_frame: 4
  attn_window: 30
  sequence_order: [video_noisy, video_condition, action_noisy, action_condition]
  mask_mode: lingbot_chunked
  cache_mode: metadata_only
  preserve_video_pretrain_history: true

action_decoder:
  # Decoder surface knobs
  # - for exact method 1 this stays on the LingBot-compatible parallel decoder
  name: lingbot_parallel_decoder
  hidden_size: 3072
  action_dim: 30
  action_horizon: 16

training:
  # Diffusion training knobs
  # - timestep counts and sigma shifts for video/action noise schedules
  video_num_train_timesteps: 1000
  action_num_train_timesteps: 1000
  video_sigma_shift: 5.0
  action_sigma_shift: 1.0
  use_teacher_forcing: false
  chunk_size: 4
  window_size: 64
  # Optimization knobs
  # - optimizer_name / scheduler_name pick the optimizer family and LR schedule
  # - warmup, accumulation, and clipping control update behavior
  optimizer_name: adamw
  scheduler_name: constant_with_warmup
  learning_rate: 1.0e-5
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  warmup_steps: 10
  gradient_accumulation_steps: 10
  max_grad_norm: 2.0
  num_steps: 5000
  text_condition_dropout_prob: 0.1
  # Supervision knobs
  # - enabled_objectives turns objective families on/off
  # - *_loss_weight scales each enabled objective without changing the runtime
  enabled_objectives: [latent, action]
  latent_loss_weight: 1.0
  action_loss_weight: 1.0
  # Trainability knobs
  # - choose which component families receive gradients
  trainable_components: [visual_tower.runtime_backbone]
  # PR88 per-sample loss weighting: scale loss by valid_action_steps so longer
  # masked-clean segments contribute more (and short ones less), normalized by
  # the dataset mean. Clamped to [0.25, 4.0].
  sample_loss_weight_mode: valid_action_steps
  sample_loss_weight_reference_steps: null
  sample_loss_weight_min: 0.25
  sample_loss_weight_max: 4.0

inference:
  # Rollout/inference knobs
  # - frame_chunk_size and *_num_inference_steps shape the denoising rollout
  video_num_inference_steps: 20
  action_num_inference_steps: 50
  frame_chunk_size: 4
  use_cache: true
  guidance_scale: 5.0
  action_guidance_scale: 1.0
  video_exec_step: -1

trainer:
  # Loop + runtime knobs
  # - runtime chooses the training engine
  # - batch_adapter chooses RGB-view vs latent-native training inputs
  # - loop_policy chooses epoch-based vs step-based training
  # - strategy chooses the launch/distribution backend
  max_epochs: 1
  limit_train_batches: null
  limit_val_batches: 0
  log_every_n_steps: 1
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  enable_checkpointing: true
  enable_model_summary: false
  runtime: composable
  batch_adapter: latents
  loop_policy: steps
  strategy: fsdp
  # Checkpoint + export knobs
  save_interval: 100 #50
  checkpoint_mode: full_training_state
  export_runtime_backbone: true
  # Logging + experiment tracking knobs
  enable_jsonl_logging: true
  enable_wandb: true
  wandb_project: openwam-method1-libero
  wandb_mode: online
