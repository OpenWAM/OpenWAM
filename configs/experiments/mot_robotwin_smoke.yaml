name: mot_robotwin_smoke

data:
  # Minimal smoke-test dataset knobs
  dataset_name: robotwin
  camera_names: [cam_high, cam_left_wrist, cam_right_wrist]
  canonical_height: 384
  canonical_width: 320
  num_frames: 4
  # Shared action/state schema knobs
  action_schema:
    action_dim: 30
    action_horizon: 8
    state_dim: 30
    state_horizon: 1

backbone:
  # Small backbone geometry for fast local verification
  implementation: shared_transformer
  hidden_size: 256
  num_layers: 1
  num_heads: 8
  attention_head_dim: 32
  ffn_dim: 1024

policy_variant:
  # Method-5 MoT action-expert runtime knobs
  name: mot
  hidden_size: 256
  attach_site: post_visual_core
  preset: fastwam
  runtime_mode: video_prefill_action_denoise
  action_expert_init_mode: video_weight_copy
  num_action_layers: 1

action_decoder:
  # Dedicated MoT decoder owns final loss/output packaging
  name: mot_decoder
  hidden_size: 256
  action_dim: 30
  action_horizon: 8

training:
  # Default to action-expert-only smoke training
  video_num_train_timesteps: 1000
  action_num_train_timesteps: 1000
  video_sigma_shift: 5.0
  action_sigma_shift: 1.0
  enabled_objectives: [action]
  trainable_components: [policy_variant.action_expert]

inference:
  # Short rollout knobs for quick inference smoke tests
  video_num_inference_steps: 4
  action_num_inference_steps: 4
  use_cache: true
  guidance_scale: 1.0

trainer:
  # Small single-process smoke-test runtime knobs
  max_epochs: 1
  limit_train_batches: 2
  limit_val_batches: 1
  log_every_n_steps: 1
  accelerator: cpu
  devices: 1
  precision: 32-true
  enable_checkpointing: false
  enable_model_summary: false
