name: register_attached_libero_smoke

data:
  # Minimal raw-LIBERO smoke dataset knobs
  dataset_name: libero
  dataset_type: lerobot_v2
  repo_id: physical-intelligence/libero
  split: train
  camera_names: [image, wrist_image]
  canonical_height: 384
  canonical_width: 320
  num_frames: 4
  frame_stride: 1
  sample_stride: 1
  episode_cache_size: 2
  train_fraction: 1.0
  split_seed: 0
  max_train_episodes: 8
  max_val_episodes: 2
  train_batch_size: 2
  val_batch_size: 2
  num_workers: 0
  view_layout:
    - source_name: image
      canonical_name: image
      top: 0
      left: 0
      height: 256
      width: 320
    - source_name: wrist_image
      canonical_name: wrist_image
      top: 256
      left: 0
      height: 128
      width: 320
  action_schema:
    action_dim: 7
    action_horizon: 6
    state_dim: 8
    state_horizon: 3
  action_target:
    representation: eef_pose_relative_to_reference
    source_key: actions
    pose_source_key: state
    state_encoding: eef_pos_axisangle_gripper_2d
    reference_source: anchor_state
    rotation_representation: axis_angle
    include_gripper: true
    gripper_representation: action_command
    gripper_action_index: -1

backbone:
  # Small shared backbone for quick raw-LIBERO verification
  implementation: shared_transformer
  hidden_size: 256
  num_layers: 1
  num_heads: 8
  attention_head_dim: 32
  ffn_dim: 1024
  load_wan_vae_frontend: false
  load_text_conditioning: false
  load_reference_core_weights: false

policy_variant:
  name: register_attached
  hidden_size: 256
  num_frame_per_block: 1
  num_action_per_block: 2
  num_state_per_block: 1
  max_chunk_size: 1
  register_layout: action_then_state
  mask_mode: dreamzero_blockwise
  couple_action_to_video_blocks: true

action_decoder:
  name: register_decoder
  hidden_size: 256
  action_dim: 7
  action_horizon: 6

training:
  video_num_train_timesteps: 1000
  action_num_train_timesteps: 1000
  video_sigma_shift: 5.0
  action_sigma_shift: 5.0
  use_teacher_forcing: false

inference:
  video_num_inference_steps: 4
  action_num_inference_steps: 4
  joint_num_inference_steps: 4
  joint_sampler: flow_match
  video_cfg_mode: guided
  action_cfg_mode: conditioned
  joint_cache_update_mode: warmup_only
  joint_cache_warmup_source: reference_video
  joint_cache_initial_warmup_anchor: start
  joint_cache_initial_warmup_frames: 1
  joint_cache_rollout_warmup_anchor: end
  joint_cache_rollout_warmup_frames: 1
  joint_observed_video_prefix_frames: 1
  use_cache: true
  guidance_scale: 1.0
  frame_chunk_size: 1

trainer:
  max_epochs: 1
  limit_train_batches: 2
  limit_val_batches: 1
  log_every_n_steps: 1
  accelerator: cpu
  devices: 1
  precision: 32-true
  enable_checkpointing: false
  enable_model_summary: false
