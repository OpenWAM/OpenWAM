# Text-conditioned causal video pretraining over one or more local LIBERO
# latent repositories. Only the shared video backbone is optimized/exported.
name: causal_video_prediction_libero_latent_local

data:
  dataset_name: libero
  dataset_type: lerobot_v2_latent_local
  local_root: "${paths.datasets.libero_root}"
  replay_status_policy: include_all
  val_replay_status_policy: include_all
  empty_text_embedding_path: "${paths.datasets.empty_text_embedding}"
  latent_subdir: latents
  camera_names:
    - observation.images.agentview_rgb
    - observation.images.eye_in_hand_rgb
  latent_camera_names:
    - observation.images.agentview_rgb
    - observation.images.eye_in_hand_rgb
  canonical_height: 128
  canonical_width: 256
  view_layout:
    - source_name: observation.images.agentview_rgb
      canonical_name: image
      top: 0
      left: 0
      height: 128
      width: 128
    - source_name: observation.images.eye_in_hand_rgb
      canonical_name: wrist_image
      top: 0
      left: 128
      height: 128
      width: 128
  num_frames: 20
  frame_stride: 1
  sample_stride: 1
  episode_cache_size: 1
  train_fraction: 0.98
  train_batch_size: 1
  val_batch_size: 1
  num_workers: 4
  action_schema:
    action_dim: 7
    action_horizon: 0
    state_dim: 8
    state_horizon: 0
  action_target:
    representation: raw
    source_key: action
    pose_source_key: observation.state
  # Counts are latent frames because this adapter reads encoded latents.
  sample_construction:
    mode: causal_prefix_suffix
    num_frames: 20
    action_horizon: 0
    state_horizon: 0
    frame_stride: 1
    causal_prefix_suffix_buckets:
      - observed_frames: 1
        future_frames: 3
      - observed_frames: 2
        future_frames: 6
      - observed_frames: 3
        future_frames: 9
      - observed_frames: 4
        future_frames: 12
      - observed_frames: 5
        future_frames: 15

backbone:
  implementation: shared_transformer
  pretrained_model_name_or_path: "${paths.models.lingbot_va_base}"
  hidden_size: 3072
  num_layers: 30
  num_heads: 24
  attention_head_dim: 128
  ffn_dim: 14336
  text_dim: 4096
  max_text_tokens: 512
  patch_size_t: 1
  patch_size_h: 2
  patch_size_w: 2
  load_wan_vae_frontend: false
  load_text_conditioning: false
  load_reference_core_weights: true
  transformer_subdir: transformer
  reference_core_init_mode: video_only

policy_variant:
  name: causal_video_prediction
  attach_site: post_visual_core
  hidden_size: 256
  # Switch to `disabled` for unconditional training with the blank-text context.
  text_conditioning_mode: task_prompt

action_decoder:
  name: video_only_decoder
  hidden_size: 256
  action_dim: 7
  action_horizon: 0

training:
  learning_rate: 1.0e-5
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 20
  num_steps: 5000
  # Train a blank-prompt branch for the standard video CFG used at inference.
  text_condition_dropout_prob: 0.1
  enabled_objectives: [latent]
  latent_loss_weight: 1.0
  action_loss_weight: 0.0
  trainable_components: [visual_tower.shared_video_backbone]
  frozen_components:
    - visual_tower.shared_action_runtime
    - visual_tower.shared_runtime_adapters

inference:
  video_num_inference_steps: 20
  # Paired with the 0.1 blank-prompt dropout above.
  guidance_scale: 5.0
  use_cache: false
  frame_chunk_size: 1

trainer:
  runtime: composable
  batch_adapter: latents
  loop_policy: steps
  strategy: fsdp
  accelerator: gpu
  precision: bf16-mixed
  default_root_dir: "${paths.outputs.train_runs_root}"
  save_interval: 100
  export_runtime_backbone: true
  runtime_backbone_export_components: [visual_tower.shared_video_backbone]
  enable_wandb: true
  wandb_project: openwam-libero-video-pretrain
