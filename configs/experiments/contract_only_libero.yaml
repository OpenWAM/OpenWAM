name: contract_only_libero

data:
  dataset_name: libero
  dataset_type: lerobot_v2
  repo_id: physical-intelligence/libero
  split: train
  camera_names: [image, wrist_image]
  canonical_height: 384
  canonical_width: 320
  num_frames: 4
  frame_stride: 1
  sample_stride: 1
  episode_cache_size: 2
  train_fraction: 0.95
  split_seed: 0
  max_train_episodes: 8
  max_val_episodes: 2
  train_batch_size: 2
  val_batch_size: 2
  num_workers: 0
  view_layout:
    - source_name: image
      canonical_name: image
      top: 0
      left: 0
      height: 256
      width: 320
    - source_name: wrist_image
      canonical_name: wrist_image
      top: 256
      left: 0
      height: 128
      width: 320
  action_schema:
    action_dim: 7
    action_horizon: 6
    state_dim: 8
    state_horizon: 1
  action_target:
    representation: eef_pose_relative_to_reference
    source_key: actions
    pose_source_key: state
    state_encoding: eef_pos_axisangle_gripper_2d
    reference_source: anchor_state
    rotation_representation: axis_angle
    include_gripper: true
    gripper_representation: first_channel

backbone:
  hidden_size: 256
  num_layers: 1
  num_heads: 8

action_head:
  name: contract_only
  hidden_size: 256
  action_dim: 7
  action_horizon: 6
  state_dim: 8

training:
  video_num_train_timesteps: 1000
  action_num_train_timesteps: 1000
  video_sigma_shift: 5.0
  action_sigma_shift: 1.0
  use_teacher_forcing: false
  chunk_size: 2
  window_size: 8

inference:
  video_num_inference_steps: 25
  action_num_inference_steps: 50
  frame_chunk_size: 2
  use_cache: true
  guidance_scale: 1.0

trainer:
  max_epochs: 1
  limit_train_batches: 2
  limit_val_batches: 1
  log_every_n_steps: 1
  accelerator: cpu
  devices: 1
  precision: 32-true
  enable_checkpointing: false
  enable_model_summary: false
