name: dual_expert_libero_generalist_joint_denoising

# dual-expert generalist joint-denoise variant.
# Per training segment, samples one of three regimes from the categorical
# in `policy_variant.generalist_denoising_mode_probs`:
#   - joint (0.6): both modalities noisy; standard packed dual-expert joint denoising.
#     Clean condition slots are preserved so the train path matches dual-expert
#     chunk-by-chunk rollout history.
#   - action_conditioned_video (0.2): clean action overrides A_noisy slot,
#     action timesteps=0, action loss masked, and clean history slots remain
#     visible through the local-history attention window. Model learns to
#     predict video given clean action condition.
#   - video_conditioned_action (0.2): clean video overrides V_noisy slot,
#     V_clean/A_clean history slots preserved, video timesteps=0, video loss
#     masked. Model learns to predict action given clean video condition.
# Coupling stays JOINT throughout — conditional regimes rely on
# clean-in-noisy-slot + timestep=0 + loss masking, not directional
# attention masks.

data:
  dataset_name: libero
  dataset_type: lerobot_v2_latent_local
  local_root: "${paths.datasets.libero_root}"
  replay_status_path: "${paths.datasets.libero_replay_status_path}"
  replay_status_policy: include_all
  val_replay_status_policy: null
  require_replay_status: false
  val_require_replay_status: false
  empty_text_embedding_path: "${paths.datasets.empty_text_embedding}"
  split: train
  camera_names: [observation.images.agentview_rgb, observation.images.eye_in_hand_rgb]
  latent_camera_names: [observation.images.agentview_rgb, observation.images.eye_in_hand_rgb]
  canonical_height: 128
  canonical_width: 256
  num_frames: 4
  frame_stride: 1
  sample_stride: 1
  sample_construction:
    mode: uniform_segment
    sample_order_mode: replacement
    chunk_size: 4
    window_size: 64
    randomize_geometry: true
    segment_min_frames: 1000
    segment_max_frames: 1000
    segment_length_stride: 1
    segment_locality_block_size: 1
    randomize_segment_length: false
    randomize_segment_start: false
    require_full_segment: true
    task_start_power: 0.0
    demo_count_power: 0.0
    trajectory_start_power: 0.0
    sample_weight_mode: uniform
  episode_cache_size: 2
  train_fraction: 1.0
  split_seed: 0
  train_batch_size: 1
  val_batch_size: 1
  num_workers: 8
  view_layout:
    - source_name: observation.images.agentview_rgb
      canonical_name: image
      top: 0
      left: 0
      height: 128
      width: 128
    - source_name: observation.images.eye_in_hand_rgb
      canonical_name: wrist_image
      top: 0
      left: 128
      height: 128
      width: 128
  action_schema:
    action_dim: 7
    action_horizon: 16
    state_dim: 8
    state_horizon: 1
  action_target:
    representation: raw
    source_key: action
    pose_source_key: observation.state
    state_encoding: eef_pos_axisangle_gripper_2d
    reference_source: anchor_state
    rotation_representation: axis_angle
    include_gripper: true
    gripper_representation: action_command
    gripper_action_index: -1
  # Default GJD mixed-dynamics sampler. Keep this in parity with the maintained
  # dual-expert legacy-prefix full-segment W64 joint command: replacement source draws,
  # uniform weights, no extra conditional-history cap.
  generalist_dynamics_mixture:
    train_latent_root: "${paths.datasets.libero_gjd_counterfactual_train_latent_root}"
    val_latent_root: "${paths.datasets.libero_gjd_counterfactual_val_latent_root}"
    allow_train_latent_root_for_val: false
    real_joint_weight: 0.6
    real_action_conditioned_video_weight: 0.1
    real_video_conditioned_action_weight: 0.1
    counterfactual_action_conditioned_video_weight: 0.1
    counterfactual_video_conditioned_action_weight: 0.1
    conditional_history_frames: null

backbone:
  implementation: shared_transformer
  train_attn_mode: flex
  infer_attn_mode: torch
  hidden_size: 3072
  num_layers: 30
  num_heads: 24
  attention_head_dim: 128
  ffn_dim: 14336
  pretrained_model_name_or_path: "${paths.models.lingbot_va_base}"
  transformer_subdir: "${paths.checkpoints.libero_videoonly_all_subsets_step_3500}"
  exported_runtime_action_init_mode: random
  max_text_tokens: 512
  load_wan_vae_frontend: true
  load_text_conditioning: true
  load_reference_core_weights: true
  reference_core_init_mode: video_only
  reference_assets_device_policy: cpu_offload

policy_variant:
  name: dual_expert
  hidden_size: 3072
  attach_site: post_visual_core
  preset: fastwam_joint
  generalist_training_paradigm: dynamics_routed
  runtime_mode: non_joint_two_stream
  # JOINT visibility is required for the A1 conditional sub-modes; validated
  # by `DualExpertPolicyConfig.__post_init__` when generalist probs are set.
  program: generalist_joint_denoising
  condition_mode: teacher_forcing_cond_video
  video_prefix_frames: 1
  sequence_contract: legacy_prefix_single_frame_perchunk_proprio
  action_expert_init_mode: video_weight_interpolate
  num_action_layers: 30
  action_hidden_size: 2048
  action_ffn_dim: 8192
  video_can_attend_action: false
  use_text_conditioning: true
  use_state_conditioning: false
  use_activation_checkpointing: true
  noisy_video_condition_prob: 0.5
  # Current GJD uses independent video/action noise clocks for parity with the
  # standard dual-expert legacy-prefix W64 joint baseline. Use `match_sigma` only for a
  # sigma-matched ablation.
  joint_timestep_coupling: independent
  # A1 generalist mixing — per-segment categorical over the three regimes.
  # Probabilities mirror the parallel-stream PR #95 default (0.6 / 0.2 / 0.2).
  generalist_denoising_mode_probs:
    joint: 0.6
    action_conditioned_video: 0.2
    video_conditioned_action: 0.2
  # Ablation knob. Leave false for vanilla/pure-joint; set true for the
  # explicit mode-token dual-expert GJD ablation.
  generalist_mode_text_token: false

action_decoder:
  name: dual_expert_decoder
  hidden_size: 3072
  action_dim: 7
  action_horizon: 16

training:
  video_num_train_timesteps: 1000
  action_num_train_timesteps: 1000
  video_sigma_shift: 5.0
  action_sigma_shift: 1.0
  use_teacher_forcing: false
  chunk_size: 4
  window_size: 64
  optimizer_name: adamw
  scheduler_name: constant_with_warmup
  learning_rate: 1.0e-5
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  warmup_steps: 10
  gradient_accumulation_steps: 10
  max_grad_norm: 2.0
  num_steps: 20000
  text_condition_dropout_prob: 0.1
  enabled_objectives: [action, latent]
  latent_loss_weight: 1.0
  action_loss_weight: 1.0
  sample_loss_weight_mode: none
  trainable_components: [policy_variant.action_expert, visual_tower.runtime_backbone]

inference:
  video_num_inference_steps: 20
  action_num_inference_steps: 20
  frame_chunk_size: 4
  use_cache: true
  guidance_scale: 5.0

validation:
  # Auxiliary held-out conditional probes. Primary trainer validation remains
  # disabled below; these tasks run from the validation loop independently.
  auxiliary_tasks:
    - name: fdm_val
      mode_override: action_conditioned_video
      dataset_split: val
      source: counterfactual_dynamics_if_available
      max_batches: 16
      report_prefix: val_fdm
    - name: idm_val
      mode_override: video_conditioned_action
      dataset_split: val
      source: counterfactual_dynamics_if_available
      max_batches: 16
      report_prefix: val_idm

trainer:
  max_epochs: 1
  limit_train_batches: null
  limit_val_batches: 0  # Primary val is off; GJD probes above still run.
  validation_interval: 100
  log_every_n_steps: 1
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  enable_checkpointing: true
  enable_model_summary: false
  runtime: composable
  batch_adapter: latents
  loop_policy: steps
  strategy: fsdp
  save_interval: 100
  # GJD defaults to exact-resumable checkpoints. The checkpoint manager still
  # exports model_state.pt alongside full_training_state.pt for rollout/eval.
  checkpoint_mode: full_training_state
  max_checkpoints_to_keep: 3
  export_runtime_backbone: true
  enable_jsonl_logging: true
  enable_wandb: true
  wandb_project: openwam-libero-policy-train
  wandb_mode: online
