name: dual_expert_libero_full_segment_non_joint_action_only_eval

# Eval wrapper for the DualExpert full-segment non-joint action-only profile.
# training checkpoint. Mirrors the training policy_variant exactly so the
# saved state_dict loads cleanly. Pass `--checkpoint .../checkpoint_step_<N>`
# on the viz script CLI; it will auto-wire `backbone.transformer_subdir` to
# `<ckpt>/transformer`.

checkpoint_path: null

data:
  dataset_name: libero
  dataset_type: lerobot_v2_latent_local
  local_root: "${paths.datasets.libero_root}"
  empty_text_embedding_path: "${paths.datasets.empty_text_embedding}"
  latent_window_profile: exact_chunked_window
  split: train
  camera_names: [observation.images.agentview_rgb, observation.images.eye_in_hand_rgb]
  latent_camera_names: [observation.images.agentview_rgb, observation.images.eye_in_hand_rgb]
  canonical_height: 128
  canonical_width: 256
  num_frames: 4
  frame_stride: 1
  sample_stride: 1
  # No `sample_construction:` block: LIBERO env-rollout eval does not go
  # through the dataset adapter (env feeds new obs each chunk), so any value
  # here is dead config. Default `WindowSamplingMode.FULL_SEGMENT` matches
  # the training YAML for consistency if anyone ever re-routes through the
  # adapter for offline checks.
  episode_cache_size: 2
  train_fraction: 1.0
  split_seed: 0
  train_batch_size: 1
  val_batch_size: 1
  num_workers: 8
  view_layout:
    - source_name: observation.images.agentview_rgb
      canonical_name: image
      top: 0
      left: 0
      height: 128
      width: 128
    - source_name: observation.images.eye_in_hand_rgb
      canonical_name: wrist_image
      top: 0
      left: 128
      height: 128
      width: 128
  action_schema:
    action_dim: 7
    action_horizon: 16
    state_dim: 8
    state_horizon: 1
  action_target:
    representation: raw
    source_key: action
    pose_source_key: observation.state
    state_encoding: eef_pos_axisangle_gripper_2d
    reference_source: anchor_state
    rotation_representation: axis_angle
    include_gripper: true
    gripper_representation: action_command
    gripper_action_index: -1

backbone:
  implementation: shared_transformer
  train_attn_mode: flex
  infer_attn_mode: torch
  hidden_size: 3072
  num_layers: 30
  num_heads: 24
  attention_head_dim: 128
  ffn_dim: 14336
  pretrained_model_name_or_path: "${paths.models.lingbot_va_base}"
  transformer_subdir: transformer
  max_text_tokens: 512
  load_wan_vae_frontend: true
  load_text_conditioning: true
  load_reference_core_weights: true
  reference_core_init_mode: full
  reference_assets_device_policy: cpu_offload

policy_variant:
  name: dual_expert
  hidden_size: 3072
  attach_site: post_visual_core
  preset: fastwam_non_joint
  runtime_mode: non_joint_two_stream
  condition_mode: teacher_forcing_cond_video
  video_prefix_frames: 1
  action_expert_init_mode: random
  num_action_layers: 30
  action_hidden_size: 2048
  action_ffn_dim: 8192
  video_can_attend_action: false
  use_text_conditioning: true
  use_state_conditioning: false

action_decoder:
  name: dual_expert_decoder
  hidden_size: 3072
  action_dim: 7
  action_horizon: 16

training:
  video_num_train_timesteps: 1000
  action_num_train_timesteps: 1000
  video_sigma_shift: 5.0
  action_sigma_shift: 1.0
  use_teacher_forcing: false
  # `chunk_size` / `window_size` are consumed at inference by
  # `mot/variant.py` for the action-expert attention mask geometry; they
  # must match the training YAML so the inference block ids and within-window
  # check reproduce the regime the model was trained on. Without these, the
  # frozen `TrainingConfig` defaults (chunk_size=2, window_size=8) silently
  # take over and the mask becomes train-OOD.
  chunk_size: 4
  window_size: 64
  optimizer_name: adamw
  scheduler_name: constant_with_warmup
  learning_rate: 1.0e-5
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  warmup_steps: 10
  gradient_accumulation_steps: 10
  max_grad_norm: 2.0
  num_steps: 5000
  text_condition_dropout_prob: 0.1
  enabled_objectives: [action]
  latent_loss_weight: 0.0
  action_loss_weight: 1.0
  trainable_components: [policy_variant.action_expert]

inference:
  video_num_inference_steps: 20
  action_num_inference_steps: 20
  joint_observed_video_prefix_frames: 1
  frame_chunk_size: 4
  use_cache: true
  guidance_scale: 5.0
  action_guidance_scale: 1.0

trainer:
  max_epochs: 1
  limit_train_batches: null
  limit_val_batches: 0
  log_every_n_steps: 1
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  enable_checkpointing: false
  enable_model_summary: false
  runtime: composable
  batch_adapter: latents
  loop_policy: steps
  strategy: single_device
  save_interval: null
  checkpoint_mode: model_only
  export_runtime_backbone: false
  enable_jsonl_logging: false
  enable_wandb: false
  wandb_project: openwam-dual-expert-libero
  wandb_mode: disabled
