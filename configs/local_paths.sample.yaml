paths:
  datasets:
    # Maintained latent-local LIBERO root. Copy this file to
    # configs/local_paths.yaml and replace every /path/to/... placeholder with
    # machine-local paths before running real data jobs.
    libero_heng_root: /path/to/datasets/libero_heng/libero_10
    # Public/local LIBERO checkout used by local HDF5 configs.
    libero_public_root: /path/to/datasets/libero/libero_10
    # Shared negative-prompt embedding used by latent-local datasets.
    empty_text_embedding: /path/to/artifacts/text/empty_emb.pt
    # Local RoboTwin LeRobot-v2 member or downloaded nested member root.
    robotwin_lerobot_video_root: /path/to/datasets/robotwin/lerobot_member
    # Local CALVIN debug or full split root containing episode_*.npz files.
    calvin_root: /path/to/datasets/calvin/task_D_D

  simulators:
    # Local RoboTwin simulator checkout containing envs/ and task_config/.
    robotwin_root: /path/to/simulators/RoboTwin
    # Local CALVIN checkout containing the calvin_env package. If CALVIN is
    # installed into the active environment, this can be omitted locally.
    calvin_root: /path/to/simulators/calvin

  models:
    # Base LingBot-compatible WAN visual model root.
    lingbot_va_base: /path/to/models/lingbot-va-base

  checkpoints:
    # Full checkpoint roots for the current comparison set. The aliases keep
    # active experiment YAMLs stable while each machine supplies its own roots.
    parallel_stream_exact_libero_step_400: /path/to/runs/parallel_stream_libero_lingbot_exact_heng_compatible/checkpoints/checkpoint_step_400
    parallel_stream_exact_libero_step_1100_0402: /path/to/runs/parallel_stream_libero_lingbot_exact_heng_compatible_0402/checkpoints/checkpoint_step_1100
    parallel_stream_joint_libero_step_300: /path/to/runs/parallel_stream_libero_lingbot_joint_denoise_heng_compatible/checkpoints/checkpoint_step_300
    parallel_stream_joint_libero_step_600_0402: /path/to/runs/parallel_stream_libero_lingbot_joint_denoise_heng_compatible_0402/checkpoints/checkpoint_step_600
    video_sequence_policy_libero_random_subwindow_step_800_0402: /path/to/runs/video_sequence_policy_libero_latent_local_random_subwindow_0402/checkpoints/checkpoint_step_800
    method4_generated_video_conditioned_step_5000: /path/to/runs/method4_post_latent_generated_video_conditioned_libero/checkpoints/checkpoint_step_5000

    # Method-1 exact and joint transformer exports.
    parallel_stream_exact_libero_latest: ${paths.checkpoints.parallel_stream_exact_libero_step_400}/transformer
    parallel_stream_joint_libero_step_400: /path/to/runs/parallel_stream_libero_lingbot_joint_denoise_heng_compatible/checkpoints/checkpoint_step_400/transformer
    parallel_stream_joint_libero_step_600: /path/to/runs/parallel_stream_libero_lingbot_joint_denoise_heng_compatible/checkpoints/checkpoint_step_600/transformer
    parallel_stream_joint_libero_contextual_fixed_geometry_step_800: /path/to/runs/parallel_stream_libero_lingbot_joint_denoise_heng_compatible_contextual_fixed_geometry/checkpoints/checkpoint_step_800/transformer

    # Shared video-only exports used by method-3 / method-4 LIBERO variants.
    libero_videoonly_step_600: /path/to/runs/libero_videoonly/checkpoints/checkpoint_step_600/transformer
    libero_videoonly_step_850: /path/to/runs/libero_videoonly/checkpoints/checkpoint_step_850/transformer

    # OBSOLETE traditional Method-2 register-attached export. Kept only so
    # historical configs can resolve paths before failing at pipeline build.
    register_attached_libero_step_1000: /path/to/runs/register_attached_libero_latent_local/checkpoints/checkpoint_step_1000/transformer

    # Method-5 eval checkpoints.
    mot_libero_idm_step_1900_root: /path/to/runs/mot_libero_latent_local_idm/checkpoints/checkpoint_step_1900
    mot_libero_joint_step_900_root: /path/to/runs/mot_libero_latent_local_joint/checkpoints/checkpoint_step_900
    mot_libero_idm_step_1900: ${paths.checkpoints.mot_libero_idm_step_1900_root}/transformer
    mot_libero_joint_step_900: ${paths.checkpoints.mot_libero_joint_step_900_root}/transformer

  outputs:
    # Default parent directory for new local training runs.
    train_runs_root: outputs/train_runs
