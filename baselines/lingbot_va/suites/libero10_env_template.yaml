# Vanilla LingBot-VA LIBERO-LONG baseline suite on LIBERO-10.
#
# Export the machine-local paths before running:
#
#   export LINGBOT_VA_MODEL_ROOT=/path/to/lingbot-va-posttrain-libero-long
#
# Then run:
#
#   CUDA_VISIBLE_DEVICES=0 PYTHONUNBUFFERED=1 \
#     python -m baselines.lingbot_va.run_libero10_baseline \
#       --suite baselines/lingbot_va/suites/libero10_env_template.yaml

source_repo: previous_works/lingbot-va
model_root: ${LINGBOT_VA_MODEL_ROOT:-/path/to/lingbot-va-posttrain-libero-long}
hf_repo_id: robbyant/lingbot-va-posttrain-libero-long
hf_revision: 0e89d1e753019988aba484e8da2dc0810e264d9f
output_dir: outputs/lingbot_va_posttrain_libero_long_libero10

checkpoints:
  - name: lingbot_va_posttrain_libero_long
    enable_offload: false

episodes:
  benchmark: libero_10
  task_ids: 0:10
  # Upstream LIBERO client default is 50 episodes per task.
  episode_indices: "0:50"
  # Leave empty to match the upstream client, which does not set a policy RNG seed.
  seed:

runtime:
  # Normal LingBot online policy rollout is pinned to EGL.
  renderer_profile: online_rollout
  # Upstream client loops while env timestep < 800.
  max_timestep: 800
  max_chunks:
  video_fps: 60
  cuda_device: 0
  render_video: false
  continue_on_error: true
  resume: true
