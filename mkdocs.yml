site_name: OpenWAM
site_description: Extensible world-action-model training and evaluation documentation
site_url: https://openwam.github.io/OpenWAM/
repo_url: https://github.com/OpenWAM/OpenWAM
repo_name: OpenWAM/OpenWAM
docs_dir: .docs_site
site_dir: site
theme:
  name: readthedocs
  highlightjs: true
extra_css:
  - assets/stylesheets/openwam.css
nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: quickstart.md
      - CLI Reference: cli.md
      - Training And Inference: running_experiments.md
      - Variable-Length Training Batches: variable_length_training_batches.md
      - Video-Only Training: video_only_training.md
      - Video Pretraining:
          - Overview: pretraining/index.md
          - Datasets: pretraining/datasets.md
          - Data Preparation: pretraining/data_processing.md
          - Multiview Training: pretraining/multiview_training.md
          - Training And Inference: pretraining/training.md
          - Batching: pretraining/batching.md
          - Object Storage: pretraining/storage.md
          - Validation: pretraining/validation.md
      - Compatibility: compatibility.md
  - Concepts:
      - Architecture: architecture.md
      - Policy Architectures: policy_architectures.md
      - Video/Action Composition: video_action_composition.md
      - Benchmarks And Data: benchmarks.md
  - Reproducibility:
      - Artifacts: artifacts.md
      - Experiment Cards: experiment_cards.md
      - Reproducibility: reproducibility.md
      - LingBot-VA LIBERO-10 Baseline: lingbot_va_baseline_libero10.md
      - Cards:
          - Card Index: cards/index.md
          - Public Tiny Synthetic: cards/public_tiny_synthetic_contract.md
  - Extending:
      - Extension SDK: extension_sdk.md
      - Add A Policy Architecture: cookbooks/new_policy_architecture.md
      - Add An Action Decoder: cookbooks/new_action_decoder.md
      - Add A Dataset: cookbooks/new_dataset.md
      - Add A Simulator Adapter: cookbooks/new_simulator_adapter.md
      - Reproduce A Result: cookbooks/reproduce_result.md
  - Development:
      - Testing: testing.md
      - Releases: release.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
validation:
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore
