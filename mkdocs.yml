site_name: Open-WAM
site_description: Extensible world-action-model training and evaluation documentation
site_url: https://daivdyuan.github.io/Open-WAM/
repo_url: https://github.com/DaivdYuan/Open-WAM
repo_name: DaivdYuan/Open-WAM
docs_dir: .docs_site
site_dir: site
theme:
  name: readthedocs
  highlightjs: true
nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: quickstart.md
      - CLI Reference: cli.md
      - Training And Inference: running_experiments.md
      - Compatibility: compatibility.md
  - Concepts:
      - Architecture: architecture.md
      - Policy Architectures: policy_architectures.md
      - Benchmarks And Data: benchmarks.md
  - Reproducibility:
      - Artifacts: artifacts.md
      - Experiment Cards: experiment_cards.md
      - Reproducibility: reproducibility.md
      - M5 GJD vs UVA Results: m5_gjd_uva_libero10_comparison.md
      - Cards:
          - Card Index: cards/index.md
          - Public Tiny Synthetic: cards/public_tiny_synthetic_contract.md
  - Extending:
      - Extension SDK: extension_sdk.md
      - Add A Policy Architecture: cookbooks/new_policy_architecture.md
      - Add An Action Decoder: cookbooks/new_action_decoder.md
      - Add A Dataset: cookbooks/new_dataset.md
      - Add A Simulator Adapter: cookbooks/new_simulator_adapter.md
      - Reproduce A Result: cookbooks/reproduce_result.md
  - Operations:
      - Testing: testing.md
      - Dual-Expert Refactor Characterization: dual_expert_refactor_characterization.md
      - Deployment Namespace: deployment_namespace.md
      - GitHub Pages: github_pages.md
      - Release Process: release.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
validation:
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore
